<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans TC','Hiragino Sans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="900" fill="#0f172a"/>

  <!-- Title -->
  <text x="40" y="48" fill="#f8fafc" font-size="28" font-weight="800">GIIS Underworld — 靈魂五層 × 對話如何被記住</text>
  <text x="40" y="78" fill="#94a3b8" font-size="15">一段外部、客觀的對話，穿過每個角色的五層靈魂，變成「主觀記憶 + 情緒殘留」，再回頭改變未來的行為。同一件事，每個人記得不一樣。</text>

  <!-- ============ LEFT LANE: the remember pipeline ============ -->

  <!-- N1: conversation -->
  <rect x="60" y="110" width="560" height="80" rx="14" fill="#0c2a45" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="80" y="140" fill="#7dd3fc" font-size="13" font-weight="800">① 一段對話（外部 · 客觀事件）</text>
  <text x="80" y="164" fill="#e2e8f0" font-size="14">真晝：「你手還在抖，先別急著整理明天的事。」</text>
  <text x="80" y="183" fill="#cbd5e1" font-size="13">海：「……嗯。我剛才其實在想你今天還沒吃飯。」</text>

  <line x1="340" y1="190" x2="340" y2="236" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="218" fill="#64748b" font-size="12">值不值得記？ conversationEligibleForLLM</text>

  <!-- N2: subjective summary -->
  <rect x="60" y="238" width="560" height="96" rx="14" fill="#10243a" stroke="#5eead4" stroke-width="1.5"/>
  <text x="80" y="266" fill="#5eead4" font-size="13" font-weight="800">② 主觀摘要（LLM · 第一人稱）</text>
  <text x="80" y="288" fill="#e2e8f0" font-size="13">從「我」的視角寫：哪個瞬間觸動我 · 什麼情緒（被看見/愧疚…）</text>
  <text x="80" y="307" fill="#e2e8f0" font-size="13">· 我對真晝的看法變了沒 · 接下來我想做什麼（= Drift 的種子）</text>
  <text x="80" y="326" fill="#94a3b8" font-size="12">同一段對話，海與真晝各跑一次 → 兩份不同的主觀記憶</text>

  <line x1="340" y1="334" x2="340" y2="374" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N3: residue intersection -->
  <rect x="60" y="376" width="560" height="150" rx="14" fill="#0f3b38" stroke="#5eead4" stroke-width="2"/>
  <text x="80" y="403" fill="#5eead4" font-size="13" font-weight="800">③ 情緒殘留 = 交會點</text>
  <!-- two inputs -->
  <rect x="78" y="414" width="248" height="58" rx="9" fill="#3b1f6e" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="92" y="434" fill="#c4b5fd" font-size="12" font-weight="700">我的 Private Self</text>
  <text x="92" y="453" fill="#e9d5ff" font-size="12">隱藏恐懼：怕自己只剩「有用」</text>
  <text x="92" y="468" fill="#e9d5ff" font-size="12">渴望：被當成人，不是工具</text>

  <rect x="354" y="414" width="248" height="58" rx="9" fill="#5c2710" stroke="#fdba74" stroke-width="1.3"/>
  <text x="368" y="434" fill="#fdba74" font-size="12" font-weight="700">真晝的 Public Self</text>
  <text x="368" y="453" fill="#fde4c7" font-size="12">她的角色 / 平常的樣子 /</text>
  <text x="368" y="468" fill="#fde4c7" font-size="12">說話方式（你只看得到表面）</text>

  <text x="282" y="445" fill="#5eead4" font-size="20" font-weight="800">×</text>
  <text x="80" y="503" fill="#a7f3d0" font-size="13" font-weight="700">→ 「海還記得真晝沒有逼她說，只是先陪著。」</text>
  <text x="80" y="520" fill="#94a3b8" font-size="12">沒碰到恐懼/渴望、也沒改變看法 → 輸出「無」（prompt 自帶共鳴閘門）</text>

  <line x1="340" y1="526" x2="340" y2="558" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N4: guards -->
  <rect x="60" y="560" width="560" height="64" rx="14" fill="#3b1212" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="80" y="586" fill="#fca5a5" font-size="13" font-weight="800">④ 守門（過不了就丟掉）</text>
  <text x="80" y="608" fill="#fecaca" font-size="12.5">口號 · 系統語 · 舞台動作 · 被對方糾正(防幻覺固化) · 同對重複(防變樣板) · 限長</text>

  <line x1="340" y1="624" x2="340" y2="660" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- N5: memory store -->
  <rect x="60" y="662" width="560" height="86" rx="14" fill="#0f3320" stroke="#86efac" stroke-width="1.5"/>
  <text x="80" y="690" fill="#86efac" font-size="13" font-weight="800">⑤ 存成記憶</text>
  <text x="80" y="713" fill="#dcfce7" font-size="13">主觀摘要 + 情緒殘留（殘留：…）+ embedding 向量</text>
  <text x="80" y="732" fill="#94a3b8" font-size="12">校園手帳「對話牆」可讀：同一段對話 → 每個人心裡留下的，並排對照</text>

  <!-- retrieval loop back to N1 -->
  <path d="M60,705 C20,705 20,150 56,150" fill="none" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <text x="14" y="430" fill="#5eead4" font-size="12" transform="rotate(-90 14 430)">召回 retrieval（vector search）→ 影響下次怎麼開口</text>

  <!-- reflection + drift band -->
  <line x1="340" y1="748" x2="340" y2="784" stroke="#fcd34d" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <rect x="60" y="786" width="270" height="86" rx="13" fill="#3a2a0c" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="76" y="812" fill="#fcd34d" font-size="13" font-weight="800">⑥ 睡前回響（每日 · SHADOW）</text>
  <text x="76" y="834" fill="#fef3c7" font-size="12.5">把一天的記憶 consolidate</text>
  <text x="76" y="852" fill="#fef3c7" font-size="12.5">成少數「長期洞察」</text>

  <line x1="330" y1="829" x2="356" y2="829" stroke="#fcd34d" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <rect x="358" y="786" width="262" height="86" rx="13" fill="#3a2a0c" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="374" y="812" fill="#fcd34d" font-size="13" font-weight="800">⑦ Behavioral Drift</text>
  <text x="374" y="834" fill="#fef3c7" font-size="12.5">明天她更主動 / 更迴避 /</text>
  <text x="374" y="852" fill="#fef3c7" font-size="12.5">更願意被照顧 — 行為慢慢變</text>

  <!-- ============ RIGHT PANEL: five-layer soul ============ -->
  <text x="700" y="100" fill="#f8fafc" font-size="17" font-weight="800">五層靈魂（每個角色都被寫好）</text>

  <!-- Public -->
  <rect x="700" y="118" width="440" height="118" rx="12" fill="#2a1407" stroke="#fdba74" stroke-width="1.5"/>
  <text x="718" y="144" fill="#fdba74" font-size="14" font-weight="800">1 · Public Self 公開自我</text>
  <text x="718" y="168" fill="#fde4c7" font-size="12.5">表面行為：角色、語氣、社交習慣、怎麼幫人。</text>
  <text x="718" y="189" fill="#fde4c7" font-size="12.5">別人只看得到這層。</text>
  <text x="718" y="216" fill="#fdba74" font-size="12">→ 餵入「對方的這層」，形成我的殘留（見 ③ 右側）</text>

  <!-- Private -->
  <rect x="700" y="246" width="440" height="118" rx="12" fill="#23104a" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="718" y="272" fill="#c4b5fd" font-size="14" font-weight="800">2 · Private Self 私密自我</text>
  <text x="718" y="296" fill="#e9d5ff" font-size="12.5">藏起的恐懼、脆弱、未滿足的渴望。</text>
  <text x="718" y="317" fill="#e9d5ff" font-size="12.5">不直接說出口，只從小選擇洩漏。</text>
  <text x="718" y="344" fill="#c4b5fd" font-size="12">→ 是「我」讀整段對話的鏡頭（見 ③ 左側）</text>

  <!-- Relational -->
  <rect x="700" y="374" width="440" height="96" rx="12" fill="#0c2a45" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="718" y="400" fill="#7dd3fc" font-size="14" font-weight="800">3 · Relational Self 關係自我</text>
  <text x="718" y="424" fill="#dbeafe" font-size="12.5">對不同人有不同的在乎方式。</text>
  <text x="718" y="445" fill="#dbeafe" font-size="12.5">→ 同樣的恐懼，對海 / 對天澤會留下不同的痕。</text>

  <!-- Residue -->
  <rect x="700" y="480" width="440" height="96" rx="12" fill="#0f3b38" stroke="#5eead4" stroke-width="1.8"/>
  <text x="718" y="506" fill="#5eead4" font-size="14" font-weight="800">4 · Emotional Residue 情緒殘留</text>
  <text x="718" y="530" fill="#a7f3d0" font-size="12.5">事件過後留在心裡的那道痕（小、選擇性、有情緒）。</text>
  <text x="718" y="551" fill="#a7f3d0" font-size="12.5">→ 就是 ③ 的產物，存進記憶（⑤）。</text>

  <!-- Drift -->
  <rect x="700" y="586" width="440" height="96" rx="12" fill="#3a2a0c" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="718" y="612" fill="#fcd34d" font-size="14" font-weight="800">5 · Behavioral Drift 行為漂移</text>
  <text x="718" y="636" fill="#fef3c7" font-size="12.5">情緒與記憶，慢慢改變行動、沉默、主動。</text>
  <text x="718" y="657" fill="#fef3c7" font-size="12.5">→ 就是 ⑦，讓世界感覺活著。</text>

  <!-- key note -->
  <text x="700" y="716" fill="#94a3b8" font-size="12.5" font-weight="700">讀法：</text>
  <text x="700" y="737" fill="#94a3b8" font-size="12.5">情緒殘留 = 「對方的 Public Self（表面行為）」 × 「我的</text>
  <text x="700" y="755" fill="#94a3b8" font-size="12.5">Private Self（恐懼/渴望）」的交會點。看不到別人的內裡，</text>
  <text x="700" y="773" fill="#94a3b8" font-size="12.5">只能用對方的表面 × 自己的深處，去長出一道屬於我的痕。</text>

  <text x="700" y="812" fill="#64748b" font-size="11.5">外部 = 客觀事件（藍）｜主觀記憶 + 殘留（青）｜守門（紅）｜長期化 + 行為改變（金）</text>
  <text x="700" y="831" fill="#64748b" font-size="11.5">參考：docs/soul/UNDERWORLD_SOUL_ARCHITECTURE.md · convex/agent/memory.ts</text>
  <text x="700" y="850" fill="#64748b" font-size="11.5">（buildResiduePrompt / llmResidueSentence / rememberConversation）</text>
</svg>
